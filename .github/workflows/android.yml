name: Android CI & Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.7.5-fork.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build, Lint & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK extras
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-37.2
            ${{ env.ANDROID_HOME }}/build-tools/37.0.0
            ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: android-sdk-37.2-ndk30-cmake3.22.1

      - name: Install Android SDK / NDK / CMake packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Release signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > signing.jks
            printf 'storeFile=signing.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$SIGNING_STORE_PASSWORD" "$SIGNING_KEY_ALIAS" "$SIGNING_KEY_PASSWORD" > signing.properties
          else
            echo "No signing secrets configured; generating temporary CI release keystore."
            keytool -genkeypair -noprompt \
              -keystore signing.jks \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass materialfiles \
              -keypass materialfiles \
              -dname "CN=MaterialFiles CI Release, OU=CI, O=MangTianYa, C=CN"
            printf 'storeFile=signing.jks\nstorePassword=materialfiles\nkeyAlias=release\nkeyPassword=materialfiles\n' > signing.properties
          fi

      - name: Build Release & Debug APKs and run Lint
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease lintVitalRelease lintDebug --console=plain
          rm -f signing.jks signing.properties

      - name: Prepare Release APK artifact
        id: release_meta
        run: |
          VERSION_NAME=$(grep -E "^\s*versionName\s+" app/build.gradle | head -n1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${VERSION_NAME}-ci.${{ github.run_number }}"
          fi
          APK_NAME="MaterialFiles-${TAG_NAME}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "${{ runner.temp }}/${APK_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "${{ runner.temp }}/app-release.apk"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaterialFiles-Release-APK
          path: |
            ${{ runner.temp }}/${{ steps.release_meta.outputs.apk_name }}
            ${{ runner.temp }}/app-release.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: Material Files Fork ${{ steps.release_meta.outputs.tag_name }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/${{ steps.release_meta.outputs.apk_name }}
            ${{ runner.temp }}/app-release.apk
          body: |
            Unofficial modified fork of [zhanghai/MaterialFiles](https://github.com/zhanghai/MaterialFiles), distributed under **GNU GPL v3.0**.

            ### Highlights
            - **100% Pure Offline**: Removed Firebase Analytics/Crashlytics, NAS/FTP network stacks, and internet permissions
            - **Dual-Pane Side-by-Side**: Adjustable split divider, directional opposite-pane Copy/Move/Link (`←` / `→`), and clipboard fallback
            - **Gesture & Batch Workflows**: Left-swipe continuous multi-select, long-press selected item menu, bottom swipe-up Recent Access sheet, Batch Rename, and Multi-Selection Properties
            - **Code Editor**: Multi-language syntax highlighting and one-click JSON/YAML formatting
            - **Root & Material You**: `libsu` / KernelSU compatibility fix and dynamic Monet icons
